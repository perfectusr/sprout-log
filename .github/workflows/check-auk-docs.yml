name: Check Auk help articles

on:
  schedule:
    - cron: "0 14 1 * *"   # 1st of every month
  workflow_dispatch:        # or run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node scripts/check-docs.mjs --update
      - name: Open a pull request if anything changed
        if: steps.check.outputs.needs_review == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auk-docs-check
          title: "Auk help articles changed — review plant timings"
          commit-message: "Update Auk article fingerprints"
          body-path: doc-check-report.md
          add-paths: data/doc-hashes.json
